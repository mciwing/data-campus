site_name: Data Campus
repo_url: https://github.com/mciwing/data-campus
site_url: https://learn-data.at
theme:
  name: material
  custom_dir: overrides
  language: de
  logo: assets/logo1.png
  favicon: assets/icon.png
  palette:
    - scheme: slate
      primary: custom  # teal
      accent: custom  # peachy peach
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.top  # 'back to top' button on scrolling
    - header.autohide
    - search.highlight
  copyright:
    © 2024 - 2025 | Manuel Ferdik & Jakob Klotz
nav:
  - Home: index.md

  - Daten:
    - Home: data/index.md
    - Einführung: data/einfuehrung.md
    - Datenerfassung: data/datenerfassung.md
    - Datenverarbeitung: data/zahlensysteme.md
    - Speicherung: data/speicherung.md

  - Datenbanken:
    - Home: database/index.md
    - Einführung: database/einfuehrung.md
    - Relationale Datenbanken: database/relational.md
    - Abfragen von Daten: database/abfragen.md
    - Daten Manipulieren: database/manipulieren.md
    - Datenmodellierung: database/modellierung.md
    - Daten Zusammenführen: database/join.md
    - Fortgeschrittene Techniken: database/fortgeschritten.md
    - Datenintegrität: database/integritaet.md
    - Transaktionen: database/transaktionen.md
    - Ausblick: database/ausblick.md
    - "Bonus: Moderne Systeme": database/moderne_systeme.md

  - Prompt Engineering:
    - Home: prompt/index.md
    - Generative KI:
      - Einleitung: prompt/einfuehrung.md
      - Funktionsweise von LLMs: prompt/funktionsweise-llms.md
      - Stärken und Grenzen von LLMs: prompt/staerken-grenzen.md
      - Halluzinationen und Kontextfenster: prompt/halluzinationen-kontextfenster.md
      - Prompt Engineering als Kompetenz: prompt/kompetenz.md
    - "Setup: Lokales LLM mit Ollama": prompt/ollama-setup.md
    - Anatomie eines guten Prompts: prompt/anatomie.md
    - Shot Prompting: prompt/shot-prompting.md
    - Iterative Prompting: prompt/iteratives.md
    - Strukturierte Ausgaben: prompt/strukturierte-ausgaben.md
    - Rollenbasiertes Prompting: prompt/rollen.md
    - Prompt Chaining: prompt/chaining.md
    - Kritisches Prompting: prompt/kritisches.md
    - Ausblick: prompt/ausblick.md


extra_css:
  - stylesheets/colors.css
  - stylesheets/extra.css
  - stylesheets/slideshow.css

markdown_extensions:
  - meta
  - attr_list
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tilde
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.progressbar
  - pymdownx.snippets:
      base_path:
        - includes
      check_paths: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/slideshow.js
  - javascripts/no-copy.js
  - javascripts/prompt-blocks.js

plugins:
  - glightbox
  - search